name: rabbit_track
description: "Rabbit Track - Professional Rabbit Farming Management Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Charts
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.4.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.10

  # Forms & Validation
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.1.2

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  rxdart: ^0.28.0
  collection: ^1.18.0
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0
  local_auth: ^2.3.0

  # PDF & Export
  pdf: ^3.11.3
  printing: ^5.13.2
  share_plus: ^10.1.4
  csv: ^6.0.0

  # Date & Time
  table_calendar: ^3.2.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Loading & Animations
  flutter_spinkit: ^5.2.1
  animate_do: ^3.3.4

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  # +1 bonus: generates the custom Android launcher icon
  flutter_launcher_icons: ^0.14.1

# +1 bonus: Rabbit Track launcher icon configuration.
# Run with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # +1 bonus: custom font (Poppins) loaded from assets/fonts.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
